services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transport
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/transport
      PORT: 8000
      # Local-only: seeds realistic demo/stress-test data on first start
      # (backend/app/scripts/seed_demo_data.py). Not set on Railway, so it
      # stays off there by default -- see backend/app/config.py.
      SEED_DEMO_DATA: "true"
    ports:
      - "8000:8000"
    volumes:
      # Uploaded firm logos (backend/app/routers/firms.py's MEDIA_DIR) --
      # without this, every `docker compose up --build` recreates the
      # container from scratch and silently wipes any uploaded logo file
      # even though the DB still points to it (logo_url survives, the
      # file doesn't).
      - media_data:/srv/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  media_data:
