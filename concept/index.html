<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17324d">
<link rel="manifest" href="manifest.json">
<title>Transport Management System</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17212b}
header{background:#17324d;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;opacity:.85}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #ddd}
nav button{white-space:nowrap;border:1px solid #ccd3da;background:#fff;border-radius:8px;padding:9px 12px}
nav button.active{background:#17324d;color:#fff}
main{max-width:1100px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid #dde2e7;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 2px #0000000b}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label{font-size:12px;font-weight:bold;color:#53606c}input,select{width:100%;padding:10px;border:1px solid #cbd3da;border-radius:7px;margin-top:4px}
.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.primary{background:#17324d;color:white;border:0;border-radius:8px;padding:10px 14px}
button.secondary{background:#eef2f5;border:1px solid #ccd3da;border-radius:8px;padding:10px 14px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e5e8eb;padding:8px;white-space:nowrap}th{background:#f5f7f9}
.metric{font-size:23px;font-weight:bold}.muted{color:#687682;font-size:12px}
.notice{background:#fff8df;border:1px solid #ecd37a;padding:10px;border-radius:8px;font-size:13px}
.error{background:#fdecea;border:1px solid #f2a29c;color:#8a1f16;padding:10px;border-radius:8px;font-size:13px;margin-top:10px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}main{padding:9px}table{font-size:12px}}
.link-btn{background:none;border:0;color:#17324d;text-decoration:underline;padding:0;font-size:12px;cursor:pointer}
/* Inline field validation: red-outlined input + small red note right below it,
   instead of one joined multi-field message at the bottom of the form. */
input.invalid,select.invalid{border-color:#d64541;background:#fff6f5}
.field-error{color:#8a1f16;font-size:11px;margin-top:3px;display:block;font-weight:normal}

/* Printable document (Bilti/GR, Loading Slip, Receipt) - styled to look like
   a real letterhead form, not a bare data dump, and sized for A4 printing. */
.gr-doc{border:1px solid #ccd3da;border-radius:4px;padding:0;background:#fff;font-size:13px;overflow:hidden;box-shadow:0 2px 10px #00000014}
.gr-head{background:#17324d;color:#fff;text-align:center;padding:18px 16px 14px}
.gr-head h2{margin:0 0 4px;font-size:24px;letter-spacing:.5px;font-weight:800}
.gr-head .tag{font-size:11px;opacity:.85;letter-spacing:.4px;text-transform:uppercase}
.gr-head .addr{font-size:11.5px;margin-top:6px;opacity:.92}
.gr-body{padding:16px 18px}
.gr-toprow{display:flex;justify-content:space-between;font-size:11.5px;color:#53606c;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #e5e8eb}
.gr-doctitle{display:flex;justify-content:space-between;align-items:baseline;background:#f5f7f9;border:1px solid #e5e8eb;border-radius:6px;padding:8px 12px;margin-bottom:10px}
.gr-doctitle b{font-size:14px;color:#17324d}
.gr-meta{display:flex;justify-content:space-between;font-size:12.5px;margin:7px 0}
.gr-meta span b{color:#17212b}
.gr-boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.gr-box{border:1px solid #ccd3da;border-radius:6px;padding:8px 10px;min-height:52px}
.gr-box b{display:block;margin-bottom:4px;font-size:10px;color:#17324d;text-transform:uppercase;letter-spacing:.4px;font-weight:800}
.gr-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
.gr-table th{background:#17324d;color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px}
.gr-table th,.gr-table td{border:1px solid #ccd3da;padding:6px 8px;text-align:left}
.gr-total-row td{font-weight:800;background:#f5f7f9}
.gr-gst{display:flex;gap:16px;font-size:11.5px;margin:10px 0;align-items:center}
.gr-gst b{color:#17324d}
.gr-insure{border:1px dashed #ccd3da;border-radius:6px;padding:8px 10px;font-size:11.5px;margin:10px 0;background:#fbfcfd}
.gr-insure b{color:#17324d}
.gr-syscert{text-align:center;font-size:11px;color:#53606c;font-style:italic;margin-top:22px;padding-top:12px;border-top:1px dashed #ccd3da}
.gr-note{font-size:10px;color:#8a949c;margin-top:8px}
.gr-bank{font-size:10.5px;color:#3d4952;background:#f5f7f9;border-top:1px solid #e5e8eb;margin-top:12px;padding:8px 18px}
@media print{
 @page{size:A4;margin:12mm}
 header,nav,.no-print{display:none!important}
 body{background:#fff}
 main{max-width:none!important;margin:0!important;padding:0!important}
 .card{box-shadow:none;border:0}
 .gr-doc{box-shadow:none;border:1px solid #ccd3da}
}
</style>
</head>
<body>
<header><h1 id="firmTitle">Sri Krishna Transport Company</h1><div class="sub">Katni, Madhya Pradesh • Multi-Firm Transport & Accounting</div></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const API="/api";
async function apiRequest(method,path,body){
 const res=await fetch(API+path,{method,headers:body?{"Content-Type":"application/json"}:undefined,body:body?JSON.stringify(body):undefined});
 if(res.status===204) return null;
 let data=null;
 try{data=await res.json();}catch(e){}
 if(!res.ok){
  let msg=(data&&data.detail)?data.detail:res.statusText;
  let fields=null;
  if(Array.isArray(msg)){
   // FastAPI/Pydantic 422 body: a list of {loc:[...,"field"], msg:"..."}.
   // Keep this structured (fields) so a form can show each message under
   // its own input instead of joining them into one bottom-of-form string.
   fields={};
   msg.forEach(e=>{fields[(e.loc||[]).slice(-1)[0]]=e.msg;});
   msg=Object.entries(fields).map(([f,m])=>`${f}: ${m}`).join("; ");
  }
  const err=new Error(msg||"Request failed");err.status=res.status;err.fields=fields;throw err;
 }
 return data;
}
const apiGet=(path)=>apiRequest("GET",path);
const apiPost=(path,body)=>apiRequest("POST",path,body);
const apiPatch=(path,body)=>apiRequest("PATCH",path,body);
const apiDelete=(path)=>apiRequest("DELETE",path);

// Inline per-field validation: clears old markers, then either places each
// server-reported message directly under its input (field-mapped errors) or
// falls back to a single concise banner for errors that aren't about one
// specific field (e.g. "bilti_no already used for this firm").
function clearFieldErrors(){
 document.querySelectorAll(".field-error").forEach(el=>el.remove());
 document.querySelectorAll(".invalid").forEach(el=>el.classList.remove("invalid"));
}
function showFieldError(id,msg){
 const el=document.getElementById(id);
 if(!el) return false;
 el.classList.add("invalid");
 const small=document.createElement("small");
 small.className="field-error";
 small.textContent=msg;
 el.insertAdjacentElement("afterend",small);
 return true;
}
function applyFormError(e,fieldMap){
 clearFieldErrors();
 if(e.fields){
  const unmapped=[];
  Object.entries(e.fields).forEach(([f,m])=>{
   if(!(fieldMap[f]&&showFieldError(fieldMap[f],m))) unmapped.push(`${f}: ${m}`);
  });
  if(unmapped.length) lastErrorBanner(unmapped.join("; "));
  const first=document.querySelector(".invalid");
  if(first) first.scrollIntoView({block:"center",behavior:"smooth"});
 } else {
  lastErrorBanner(e.message);
 }
}
function lastErrorBanner(msg){
 const host=document.querySelector(".form-error-slot");
 if(host) host.innerHTML=`<div class="error">${msg}</div>`; else alert(msg);
}

let state={firm:null,firms:[],bilties:[],loading:[],agents:[],truckOwners:[],vehicles:[],agentPayments:[],truckOwnerPayments:[],receipts:[],reportView:"firm"};
let lastError=null;
const navItems=["Dashboard","Loading Slip","Bilti / GR","Agent Ledger","Truck Owner Ledger","Final Receipt","Reports","Firm Setup"];
const LISTED_SCREENS=["Dashboard","Loading Slip","Bilti / GR","Agent Ledger","Truck Owner Ledger","Final Receipt","Reports"];
function nav(){
 document.getElementById("nav").innerHTML=navItems.map((x,i)=>`<button class="${i==0?'active':''}" onclick="show('${x}')">${x}</button>`).join("");
}
async function refreshData(){
 const [loading,bilties,agents,truckOwners,vehicles,agentPayments,truckOwnerPayments,receipts]=await Promise.all([
  apiGet("/loading-slips"),apiGet("/bilties"),apiGet("/agents"),apiGet("/truck-owners"),apiGet("/vehicles"),
  apiGet("/agent-payments"),apiGet("/truck-owner-payments"),apiGet("/receipts")
 ]);
 state.loading=loading;state.bilties=bilties;state.agents=agents;state.truckOwners=truckOwners;state.vehicles=vehicles;
 state.agentPayments=agentPayments;state.truckOwnerPayments=truckOwnerPayments;state.receipts=receipts;
}
function firmName(id){const f=state.firms.find(x=>x.id===id);return f?f.name:id;}
function money(x){return Number(x||0).toFixed(2);}
// Native dropdown-with-manual-fallback: <input list="..."> bound to a
// <datalist> shows existing values as suggestions while still accepting
// free text, matching how Agent/Truck Owner/Vehicle are get-or-create'd
// server-side.
function datalists(){
 return `<datalist id="dl_vehicles">${state.vehicles.map(v=>`<option value="${v.vehicle_no}">`).join("")}</datalist>
 <datalist id="dl_truck_owners">${state.truckOwners.map(o=>`<option value="${o.name}">`).join("")}</datalist>
 <datalist id="dl_agents">${state.agents.map(a=>`<option value="${a.name}">`).join("")}</datalist>`;
}
async function show(name){
 document.title="Transport Management System";
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.textContent===name));
 const a=document.getElementById("app");
 const errBefore=lastError;lastError=null;
 if(LISTED_SCREENS.includes(name)){
  try{await refreshData();}catch(e){a.innerHTML=`<div class="card"><div class="error">Failed to load data: ${e.message}</div></div>`;return;}
 }
 if(name==="Dashboard") a.innerHTML=dashboard();
 if(name==="Loading Slip") a.innerHTML=loadingForm(errBefore);
 if(name==="Bilti / GR") a.innerHTML=biltiForm(errBefore);
 if(name==="Agent Ledger") a.innerHTML=agentLedger(errBefore);
 if(name==="Truck Owner Ledger") a.innerHTML=ownerLedger(errBefore);
 if(name==="Final Receipt") a.innerHTML=receiptForm(errBefore);
 if(name==="Reports"){state.reportView="firm";a.innerHTML=reports();}
 if(name==="Firm Setup") a.innerHTML=firmSetup(errBefore);
}
function dashboard(){
 return `<div class="card"><h2>Dashboard</h2><div class="grid">
 <div><div class="metric">${state.bilties.length}</div><div class="muted">Bilties</div></div>
 <div><div class="metric">${state.loading.length}</div><div class="muted">Loading Slips</div></div>
 <div><div class="metric">₹${sum("dalali")}</div><div class="muted">Dalali</div></div>
 <div><div class="metric">₹${sum("freight_difference")}</div><div class="muted">Hidden Freight Difference</div></div>
 </div></div>
 <div class="notice">Current firm: <b>${state.firm?state.firm.name:"(none)"}</b>. All new documents inherit this firm automatically.</div>`;
}
function loadingForm(err){
 let rows=state.loading.map(x=>`<tr><td>${x.slip_date}</td><td>${firmName(x.firm_id)}</td><td>${x.vehicle.vehicle_no}</td><td>${x.truck_owner?x.truck_owner.name:""}</td><td>${x.agent?x.agent.name:""}</td><td>${x.loading_point}</td><td>${x.destination}</td><td>${x.goods_description}</td><td>${x.quantity_weight}</td><td>${x.package_count||""}</td><td><button class="link-btn" onclick="printLoadingSlip('${x.id}')">View / Download</button></td></tr>`).join("");
 return `<div class="card"><h2>Loading Slip</h2>${datalists()}<div class="grid">
 <label>Lorry / Vehicle No.<input id="l_vehicle" list="dl_vehicles" required></label>
 <label>Date<input id="l_date" type="date" required></label>
 <label>M/s (Truck Owner)<input id="l_owner" list="dl_truck_owners"></label>
 <label>Through / Broker<input id="l_agent" list="dl_agents"></label>
 <label>Loading Point<input id="l_from" required></label>
 <label>Destination<input id="l_to" required></label>
 <label>Goods / Material<input id="l_goods" required></label>
 <label>Quantity / Weight<input id="l_qty" required></label>
 <label>Package Count (कट्टी)<input id="l_pkgcount" placeholder="e.g. 500 bags"></label>
 <label>Advance Rs<input id="l_advance" type="number" min="0" step="0.01" value="0"></label>
 <label class="full">Advance Breakdown (notes)<input id="l_advnote" placeholder="itemized advance lines, if any"></label>
 </div>
 <div class="form-error-slot">${err?`<div class="error">${err}</div>`:""}</div>
 <div class="actions"><button class="primary" onclick="addLoading()">Save Loading Slip</button></div></div>
 <div class="card"><h3>Recent Loading Slips</h3><div class="table-wrap"><table><tr><th>Date</th><th>Firm</th><th>Vehicle</th><th>Truck Owner</th><th>Broker</th><th>From</th><th>To</th><th>Goods</th><th>Qty</th><th>Pkgs</th><th></th></tr>${rows||"<tr><td colspan=11>No entries</td></tr>"}</table></div></div>`;
}
const LOADING_FIELD_MAP={vehicle_no:"l_vehicle",slip_date:"l_date",truck_owner_name:"l_owner",agent_name:"l_agent",loading_point:"l_from",destination:"l_to",goods_description:"l_goods",quantity_weight:"l_qty",package_count:"l_pkgcount",advance_amount:"l_advance",advance_note:"l_advnote"};
async function addLoading(){
 if(!state.firm){lastError="Select a firm first (Firm Setup).";return show("Loading Slip");}
 clearFieldErrors();
 let created;
 try{
  created=await apiPost("/loading-slips",{firm_id:state.firm.id,slip_date:v("l_date"),vehicle_no:v("l_vehicle"),truck_owner_name:v("l_owner")||null,agent_name:v("l_agent")||null,loading_point:v("l_from"),destination:v("l_to"),goods_description:v("l_goods"),quantity_weight:v("l_qty"),package_count:v("l_pkgcount")||null,advance_amount:n("l_advance"),advance_note:v("l_advnote")||null});
 }catch(e){applyFormError(e,LOADING_FIELD_MAP);return;}
 await printLoadingSlip(created.id);
}
async function printLoadingSlip(id){
 let x;
 try{x=await apiGet(`/loading-slips/${id}`);}catch(e){alert("Could not load Loading Slip: "+e.message);return;}
 const firm=state.firms.find(f=>f.id===x.firm_id)||{};
 document.getElementById("nav").querySelectorAll("button").forEach(b=>b.classList.remove("active"));
 document.title=`LR-${x.vehicle.vehicle_no}-${x.slip_date}`;
 document.getElementById("app").innerHTML=loadingSlipPrintView(x,firm);
}
function loadingSlipPrintView(x,firm){
 return `<div class="card no-print"><div class="actions">
  <button class="secondary" onclick="show('Dashboard')">← Back</button>
  <button class="primary" onclick="window.print()">Download / Print (PDF)</button>
 </div><p class="muted">In the print dialog, choose "Save as PDF" as the destination to download a file you can share on WhatsApp/email.</p></div>
 <div class="card gr-doc">
 <div class="gr-head"><h2>${firm.name||""}</h2><div class="tag">लोडिंग स्लिप — Loading Slip</div>
 ${firm.address?`<div class="addr">${firm.address}</div>`:""}</div>
 <div class="gr-body">
 <div class="gr-toprow"><span>${x.agent?"Through: "+x.agent.name:""}</span><span>${firm.phone?"Mob: "+firm.phone:""}</span></div>
 <div class="gr-doctitle"><b>Loading Instruction</b><span>Date: ${x.slip_date}</span></div>
 <div class="gr-box"><b>M/s (Truck Owner)</b>${x.truck_owner?x.truck_owner.name:""}</div>
 <p>आपके पास गाड़ी क्र. <b>${x.vehicle.vehicle_no}</b> जा रही है, इसमें <b>${x.goods_description}</b> का <b>${x.quantity_weight}</b> चढ़ (कट्टी ${x.package_count||"—"}) लोड करवाने की कृपा करें।</p>
 <div class="gr-meta"><span>From: ${x.loading_point}</span><span>To: ${x.destination}</span></div>
 ${Number(x.advance_amount)>0?`<div class="gr-meta"><span>Advance: ₹${money(x.advance_amount)}</span><span></span></div>`:""}
 ${x.advance_note?`<div class="gr-meta"><span>Notes: ${x.advance_note}</span></div>`:""}
 <div class="gr-syscert">This is a system-generated document and does not require a signature.</div>
 </div>
 </div>`;
}
function biltiForm(err){
 let rows=state.bilties.map(x=>`<tr><td>${x.bilti_date}</td><td>${x.bilti_no}</td><td>${firmName(x.firm_id)}</td><td>${x.consignor}</td><td>₹${money(x.freight)}</td><td>₹${money(x.grand_total)}</td><td>₹${money(x.topay)}</td><td><button class="link-btn" onclick="printBilti('${x.id}')">View / Download</button></td></tr>`).join("");
 return `<div class="card"><h2>Bilti / GR</h2>${datalists()}<div class="grid">
 <label>Bilti No.<input id="b_no" required></label><label>Date<input id="b_date" type="date" required></label>
 <label>Consignor / Goods Provider<input id="b_party" required></label><label>Consignee<input id="b_consignee" required></label>
 <label>From<input id="b_from" required></label><label>To<input id="b_to" required></label>
 <label>Lorry No.<input id="b_vehicle" list="dl_vehicles" required></label>
 <label>Palti (Alt.) Lorry No.<input id="b_palti" list="dl_vehicles"></label>
 <label>Truck Owner<input id="b_owner" list="dl_truck_owners" required></label>
 <label>Agent / Dalal (Broker)<input id="b_agent" list="dl_agents"></label>
 <label>Goods / Description<input id="b_goods" required></label>
 <label>Package Count / Unit<input id="b_pkgcount" placeholder="e.g. 67" style="width:60%;display:inline-block"><input id="b_pkgunit" placeholder="BAG" style="width:38%;display:inline-block;margin-left:2%"></label>
 <label>Weight (Actual)<input id="b_weight" required oninput="updateBiltiTotals()"></label>
 <label>Weight (Charged)<input id="b_cweight"></label>
 <label>Freight Rate<input id="b_rate" type="number" min="0" step="0.01"></label>
 <label>Freight<input id="b_freight" type="number" min="0.01" step="0.01" required oninput="updateBiltiTotals()"></label>
 <label>Other Charges<input id="b_other" type="number" min="0" step="0.01" value="0" oninput="updateBiltiTotals()"></label>
 <label>Kanta Charges<input id="b_kanta" type="number" min="0" step="0.01" value="0" oninput="updateBiltiTotals()"></label>
 <label>Bahi Charges<input id="b_bahi" type="number" min="0" step="0.01" value="0" oninput="updateBiltiTotals()"></label>
 <label>Service Tax<input id="b_stax" type="number" min="0" step="0.01" value="0" oninput="updateBiltiTotals()"></label>
 <label>Hamali<input id="b_hamali" type="number" min="0" step="0.01" value="0" oninput="updateBiltiTotals()"></label>
 <label>P.Freight<input id="b_pfreight" type="number" min="0" step="0.01" value="0" oninput="updateBiltiTotals()"></label>
 <label>Dalali (visible on Bilti)<input id="b_dalali" type="number" min="0" step="0.01" value="0"></label>
 <label>Advance to Truck Owner<input id="b_advance" type="number" min="0" step="0.01" value="0" oninput="updateBiltiTotals()"></label>
 <label class="full no-print">FD — Freight Difference (hidden from printed Bilti)<input id="b_fd" type="number" min="0" step="0.01" value="0"></label>
 <label>GST Paid By<select id="b_gst"><option value="">(unspecified)</option><option value="consignor">Consignor</option><option value="consignee">Consignee</option><option value="transporter">Transporter</option><option value="exempted">Exempted</option></select></label>
 <label>E-Way Bill No.<input id="b_eway"></label>
 <label>Invoice Value<input id="b_invoice" type="number" min="0" step="0.01"></label>
 <label>Goods Value Declared (Owner's Risk)<input id="b_goodsvalue" type="number" min="0" step="0.01"></label>
 <label class="full">Remark<input id="b_remark"></label>
 </div>
 <details class="card" style="margin-top:10px"><summary>Insurance details (optional)</summary><div class="grid" style="margin-top:10px">
 <label>Insured?<select id="b_insured"><option value="">(unspecified)</option><option value="true">Yes</option><option value="false">No</option></select></label>
 <label>Insurance Company<input id="b_inscompany"></label>
 <label>Policy No.<input id="b_inspolicy"></label>
 <label>Insured Amount<input id="b_insamount" type="number" min="0" step="0.01"></label>
 <label>Insurance Date<input id="b_insdate" type="date"></label>
 <label>Risk<input id="b_insrisk"></label>
 <label class="full">Insurance Agent Name<input id="b_insagent"></label>
 </div></details>
 <div class="notice">FD is stored in accounting and Agent/Dalal ledger, but is excluded from the printed Bilti.</div>
 <div class="notice">Grand Total: ₹<span id="b_gt_display">0.00</span> · To Pay: ₹<span id="b_tp_display">0.00</span></div>
 <div class="form-error-slot">${err?`<div class="error">${err}</div>`:""}</div>
 <div class="actions"><button class="primary" onclick="addBilti()">Save Bilti</button></div></div>
 <div class="card"><h3>Recent Bilties</h3><div class="table-wrap"><table><tr><th>Date</th><th>Bilti No.</th><th>Firm</th><th>Consignor</th><th>Freight</th><th>Grand Total</th><th>To Pay</th><th></th></tr>${rows||"<tr><td colspan=8>No entries</td></tr>"}</table></div></div>`;
}
function updateBiltiTotals(){
 const freight=n("b_freight"),other=n("b_other"),kanta=n("b_kanta"),bahi=n("b_bahi"),stax=n("b_stax"),hamali=n("b_hamali"),pfreight=n("b_pfreight"),advance=n("b_advance");
 const grand=freight+other+kanta+bahi+stax+hamali+pfreight;
 document.getElementById("b_gt_display").textContent=grand.toFixed(2);
 document.getElementById("b_tp_display").textContent=(grand-advance).toFixed(2);
}

}
function reportBiltiWise(){
 let rows=state.bilties.map(x=>`<tr><td>${x.bilti_date}</td><td>${x.bilti_no}</td><td>${firmName(x.firm_id)}</td><td>${x.consignor}</td><td>${x.consignee}</td><td>${x.vehicle.vehicle_no}</td><td>${x.truck_owner.name}</td><td>${x.agent?x.agent.name:""}</td><td>₹${money(x.freight)}</td><td>₹${money(x.dalali)}</td><td>₹${money(x.advance_to_owner)}</td><td>₹${money(x.freight_difference)}</td></tr>`);
 return reportTable("Bilti-wise Report",["Date","Bilti No","Firm","Consignor","Consignee","Vehicle","Truck Owner","Agent","Freight","Dalali","Advance","FD"],rows,12);
}
function reportParty(){
 let byParty={};
 state.bilties.forEach(x=>{byParty[x.consignor]=byParty[x.consignor]||{count:0,freight:0};byParty[x.consignor].count++;byParty[x.consignor].freight+=Number(x.freight);});
 let rows=Object.entries(byParty).map(([name,v])=>`<tr><td>${name}</td><td>${v.count}</td><td>₹${money(v.freight)}</td></tr>`);
 return reportTable("Party / Goods Provider Report",["Party (Consignor)","Bilties","Total Freight"],rows,3);
}
function reportAgent(){
 let balances={};
 state.bilties.filter(x=>x.agent).forEach(x=>{const k=x.agent.id;balances[k]=balances[k]||{name:x.agent.name,accrued:0,paid:0};balances[k].accrued+=Number(x.dalali)+Number(x.freight_difference);});
 state.agentPayments.forEach(p=>{const k=p.agent.id;balances[k]=balances[k]||{name:p.agent.name,accrued:0,paid:0};balances[k].paid+=Number(p.amount);});
 let rows=Object.values(balances).map(b=>`<tr><td>${b.name}</td><td>₹${money(b.accrued)}</td><td>₹${money(b.paid)}</td><td>₹${money(b.accrued-b.paid)}</td></tr>`);
 return reportTable("Agent / Dalal Report",["Agent","Accrued","Paid","Balance"],rows,4);
}
function reportFD(){
 let withFd=state.bilties.filter(x=>Number(x.freight_difference)>0);
 let total=withFd.reduce((s,x)=>s+Number(x.freight_difference),0);
 let rows=withFd.map(x=>`<tr><td>${x.bilti_date}</td><td>${x.bilti_no}</td><td>${firmName(x.firm_id)}</td><td>${x.agent?x.agent.name:""}</td><td>₹${money(x.freight_difference)}</td></tr>`);
 if(withFd.length) rows.push(`<tr><td colspan=4><b>Total</b></td><td><b>₹${money(total)}</b></td></tr>`);
 return reportTable("Freight Difference Report",["Date","Bilti No","Firm","Agent","FD"],rows,5);
}
function reportOwner(){
 let balances={};
 state.bilties.forEach(x=>{const k=x.truck_owner.id;balances[k]=balances[k]||{name:x.truck_owner.name,freight:0,advance:0,paid:0};balances[k].freight+=Number(x.freight);balances[k].advance+=Number(x.advance_to_owner);});
 state.truckOwnerPayments.forEach(p=>{const k=p.truck_owner.id;balances[k]=balances[k]||{name:p.truck_owner.name,freight:0,advance:0,paid:0};balances[k].paid+=Number(p.amount);});
 let rows=Object.values(balances).map(b=>`<tr><td>${b.name}</td><td>₹${money(b.freight)}</td><td>₹${money(b.advance)}</td><td>₹${money(b.paid)}</td><td>₹${money(b.freight-b.advance-b.paid)}</td></tr>`);
 return reportTable("Truck Owner Report",["Owner","Freight","Advance","Paid","Balance"],rows,5);
}
function reportLorry(){
 let byVehicle={};
 state.bilties.forEach(x=>{const vno=x.vehicle.vehicle_no;byVehicle[vno]=byVehicle[vno]||{trips:0,freight:0};byVehicle[vno].trips++;byVehicle[vno].freight+=Number(x.freight);});
 let rows=Object.entries(byVehicle).map(([vehicle,v])=>`<tr><td>${vehicle}</td><td>${v.trips}</td><td>₹${money(v.freight)}</td></tr>`);
 return reportTable("Lorry / Trip Report",["Vehicle","Trips","Total Freight"],rows,3);
}
function reportAdvance(){
 let withAdvance=state.bilties.filter(x=>Number(x.advance_to_owner)>0);
 let total=withAdvance.reduce((s,x)=>s+Number(x.advance_to_owner),0);
 let rows=withAdvance.map(x=>`<tr><td>${x.bilti_date}</td><td>${x.bilti_no}</td><td>${x.truck_owner.name}</td><td>₹${money(x.advance_to_owner)}</td></tr>`);
 if(withAdvance.length) rows.push(`<tr><td colspan=3><b>Total</b></td><td><b>₹${money(total)}</b></td></tr>`);
 return reportTable("Advance Report",["Date","Bilti No","Owner","Advance"],rows,4);
}
function reportReceipt(){
 let rows=state.receipts.map(r=>`<tr><td>${r.receipt_date}</td><td>${(state.bilties.find(b=>b.id===r.bilti_id)||{}).bilti_no||""}</td><td>${firmName(r.firm_id)}</td><td>${r.received_from}</td><td>₹${money(r.amount)}</td><td>${r.remarks||""}</td></tr>`);
 return reportTable("Final Receipt Report",["Date","Bilti No","Firm","Received From","Amount","Remarks"],rows,6);
}
function reportOutstanding(){
 let rows=state.bilties.map(x=>{
  let received=state.receipts.filter(r=>r.bilti_id===x.id).reduce((s,r)=>s+Number(r.amount),0);
  let outstanding=Number(x.freight)-received;
  return {x,received,outstanding};
 }).filter(r=>r.outstanding!==0).map(({x,received,outstanding})=>`<tr><td>${firmName(x.firm_id)}</td><td>${x.bilti_no}</td><td>${x.consignee}</td><td>₹${money(x.freight)}</td><td>₹${money(received)}</td><td>₹${money(outstanding)}</td></tr>`);
 return reportTable("Outstanding Report",["Firm","Bilti No","Consignee","Freight","Received","Outstanding"],rows,6);
}
function reportDayBook(){
 let events=[];
 state.loading.forEach(x=>events.push({date:x.slip_date,type:"Loading Slip",desc:`${x.vehicle.vehicle_no}: ${x.loading_point} → ${x.destination}`,amount:null}));
 state.bilties.forEach(x=>events.push({date:x.bilti_date,type:"Bilti",desc:`${x.bilti_no} (${x.consignor} → ${x.consignee})`,amount:x.freight}));
 state.agentPayments.forEach(p=>events.push({date:p.payment_date,type:"Agent Payment",desc:p.agent.name,amount:p.amount}));
 state.truckOwnerPayments.forEach(p=>events.push({date:p.payment_date,type:"Owner Payment",desc:p.truck_owner.name,amount:p.amount}));
 state.receipts.forEach(r=>events.push({date:r.receipt_date,type:"Receipt",desc:r.received_from,amount:r.amount}));
 events.sort((a,b)=>b.date.localeCompare(a.date));
 let rows=events.map(e=>`<tr><td>${e.date}</td><td>${e.type}</td><td>${e.desc}</td><td>${e.amount!=null?"₹"+money(e.amount):""}</td></tr>`);
 return reportTable("Day Book",["Date","Type","Details","Amount"],rows,4);
}
function firmSetup(err){
 const f=state.firm||{};
 return `<div class="card"><h2>Firm Setup</h2><div class="grid"><label>Current Firm<select id="firmSelect" onchange="selectFirm()">${state.firms.map(x=>`<option value="${x.id}" ${state.firm&&x.id===state.firm.id?'selected':''}>${x.name}</option>`).join("")}</select></label></div><p class="muted">The selected firm automatically prints on Loading Slip, Bilti and Final Receipt and is attached to every ledger entry.</p></div>
 <div class="card"><h3>Firm Letterhead &amp; Bank Details</h3><div class="grid">
 <label class="full">Address<input id="f_address" value="${f.address||''}"></label>
 <label>Phone<input id="f_phone" value="${f.phone||''}"></label>
 <label>Email<input id="f_email" value="${f.email||''}"></label>
 <label>PAN No.<input id="f_pan" value="${f.pan_no||''}"></label>
 <label>Bank Name<input id="f_bankname" value="${f.bank_name||''}"></label>
 <label>Bank Branch<input id="f_bankbranch" value="${f.bank_branch||''}"></label>
 <label>Bank A/c No.<input id="f_bankacct" value="${f.bank_account_no||''}"></label>
 <label>Bank IFSC<input id="f_bankifsc" value="${f.bank_ifsc||''}"></label>
 </div>
 <div class="form-error-slot">${err?`<div class="error">${err}</div>`:""}</div>
 <div class="actions"><button class="primary" onclick="saveFirmDetails()">Save Firm Details</button></div></div>`;
}
const FIRM_FIELD_MAP={address:"f_address",phone:"f_phone",email:"f_email",pan_no:"f_pan",bank_name:"f_bankname",bank_branch:"f_bankbranch",bank_account_no:"f_bankacct",bank_ifsc:"f_bankifsc"};
function selectFirm(){
 const id=document.getElementById("firmSelect").value;
 state.firm=state.firms.find(f=>f.id===id)||null;
 updateHeader();show("Firm Setup");
}
async function saveFirmDetails(){
 if(!state.firm){lastError="Select a firm first.";return show("Firm Setup");}
 clearFieldErrors();
 try{
  const updated=await apiPatch(`/firms/${state.firm.id}`,{
   address:v("f_address")||null,phone:v("f_phone")||null,email:v("f_email")||null,pan_no:v("f_pan")||null,
   bank_name:v("f_bankname")||null,bank_branch:v("f_bankbranch")||null,bank_account_no:v("f_bankacct")||null,
   bank_ifsc:v("f_bankifsc")||null
  });
  state.firms=state.firms.map(x=>x.id===updated.id?updated:x);
  state.firm=updated;
 }catch(e){applyFormError(e,FIRM_FIELD_MAP);return;}
 alert("Firm details saved");show("Firm Setup");
}
function updateHeader(){document.getElementById("firmTitle").textContent=state.firm?state.firm.name:"Transport Management System"}
function v(id){return document.getElementById(id).value} function n(id){return Number(v(id)||0)}
function sum(k){return state.bilties.reduce((s,x)=>s+(Number(x[k])||0),0).toFixed(2)}
async function init(){
 nav();
 try{
  state.firms=await apiGet("/firms");
  state.firm=state.firms[0]||null;
  updateHeader();
 }catch(e){
  document.getElementById("app").innerHTML=`<div class="card"><div class="error">Could not reach the API: ${e.message}</div></div>`;
  return;
 }
 show("Dashboard");
}
init();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
