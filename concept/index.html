<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17324d">
<link rel="manifest" href="manifest.json">
<title>Transport Management System</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17212b}
header{background:#17324d;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;opacity:.85}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #ddd}
nav button{white-space:nowrap;border:1px solid #ccd3da;background:#fff;border-radius:8px;padding:9px 12px}
nav button.active{background:#17324d;color:#fff}
main{max-width:1100px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid #dde2e7;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 2px #0000000b}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label{font-size:12px;font-weight:bold;color:#53606c}input,select{width:100%;padding:10px;border:1px solid #cbd3da;border-radius:7px;margin-top:4px}
.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button.primary{background:#17324d;color:white;border:0;border-radius:8px;padding:10px 14px}
button.secondary{background:#eef2f5;border:1px solid #ccd3da;border-radius:8px;padding:10px 14px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e5e8eb;padding:8px;white-space:nowrap}th{background:#f5f7f9}
.metric{font-size:23px;font-weight:bold}.muted{color:#687682;font-size:12px}
.notice{background:#fff8df;border:1px solid #ecd37a;padding:10px;border-radius:8px;font-size:13px}
.error{background:#fdecea;border:1px solid #f2a29c;color:#8a1f16;padding:10px;border-radius:8px;font-size:13px;margin-top:10px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}main{padding:9px}table{font-size:12px}}
@media print{header,nav,.no-print{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<header><h1 id="firmTitle">Sri Krishna Transport Company</h1><div class="sub">Katni, Madhya Pradesh • Multi-Firm Transport & Accounting</div></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const API="/api";
async function apiRequest(method,path,body){
 const res=await fetch(API+path,{method,headers:body?{"Content-Type":"application/json"}:undefined,body:body?JSON.stringify(body):undefined});
 if(res.status===204) return null;
 let data=null;
 try{data=await res.json();}catch(e){}
 if(!res.ok){
  let msg=(data&&data.detail)?data.detail:res.statusText;
  if(Array.isArray(msg)) msg=msg.map(e=>`${(e.loc||[]).slice(-1)[0]}: ${e.msg}`).join("; ");
  const err=new Error(msg||"Request failed");err.status=res.status;throw err;
 }
 return data;
}
const apiGet=(path)=>apiRequest("GET",path);
const apiPost=(path,body)=>apiRequest("POST",path,body);
const apiPatch=(path,body)=>apiRequest("PATCH",path,body);
const apiDelete=(path)=>apiRequest("DELETE",path);

let state={firm:null,firms:[],bilties:[],loading:[],agents:[],truckOwners:[],agentPayments:[],truckOwnerPayments:[],receipts:[],reportView:"firm"};
let lastError=null;
const navItems=["Dashboard","Loading Slip","Bilti / GR","Agent Ledger","Truck Owner Ledger","Final Receipt","Reports","Firm Setup"];
const LISTED_SCREENS=["Dashboard","Loading Slip","Bilti / GR","Agent Ledger","Truck Owner Ledger","Final Receipt","Reports"];
function nav(){
 document.getElementById("nav").innerHTML=navItems.map((x,i)=>`<button class="${i==0?'active':''}" onclick="show('${x}')">${x}</button>`).join("");
}
async function refreshData(){
 const [loading,bilties,agents,truckOwners,agentPayments,truckOwnerPayments,receipts]=await Promise.all([
  apiGet("/loading-slips"),apiGet("/bilties"),apiGet("/agents"),apiGet("/truck-owners"),
  apiGet("/agent-payments"),apiGet("/truck-owner-payments"),apiGet("/receipts")
 ]);
 state.loading=loading;state.bilties=bilties;state.agents=agents;state.truckOwners=truckOwners;
 state.agentPayments=agentPayments;state.truckOwnerPayments=truckOwnerPayments;state.receipts=receipts;
}
function firmName(id){const f=state.firms.find(x=>x.id===id);return f?f.name:id;}
function money(x){return Number(x||0).toFixed(2);}
async function show(name){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.textContent===name));
 const a=document.getElementById("app");
 const errBefore=lastError;lastError=null;
 if(LISTED_SCREENS.includes(name)){
  try{await refreshData();}catch(e){a.innerHTML=`<div class="card"><div class="error">Failed to load data: ${e.message}</div></div>`;return;}
 }
 if(name==="Dashboard") a.innerHTML=dashboard();
 if(name==="Loading Slip") a.innerHTML=loadingForm(errBefore);
 if(name==="Bilti / GR") a.innerHTML=biltiForm(errBefore);
 if(name==="Agent Ledger") a.innerHTML=agentLedger(errBefore);
 if(name==="Truck Owner Ledger") a.innerHTML=ownerLedger(errBefore);
 if(name==="Final Receipt") a.innerHTML=receiptForm(errBefore);
 if(name==="Reports"){state.reportView="firm";a.innerHTML=reports();}
 if(name==="Firm Setup") a.innerHTML=firmSetup();
}
function dashboard(){
 return `<div class="card"><h2>Dashboard</h2><div class="grid">
 <div><div class="metric">${state.bilties.length}</div><div class="muted">Bilties</div></div>
 <div><div class="metric">${state.loading.length}</div><div class="muted">Loading Slips</div></div>
 <div><div class="metric">₹${sum("dalali")}</div><div class="muted">Dalali</div></div>
 <div><div class="metric">₹${sum("freight_difference")}</div><div class="muted">Hidden Freight Difference</div></div>
 </div></div>
 <div class="notice">Current firm: <b>${state.firm?state.firm.name:"(none)"}</b>. All new documents inherit this firm automatically.</div>`;
}
function loadingForm(err){
 let rows=state.loading.map(x=>`<tr><td>${x.slip_date}</td><td>${firmName(x.firm_id)}</td><td>${x.vehicle_no}</td><td>${x.loading_point}</td><td>${x.destination}</td><td>${x.goods_description}</td><td>${x.quantity_weight}</td></tr>`).join("");
 return `<div class="card"><h2>Loading Slip</h2><div class="grid">
 <label>Lorry / Vehicle No.<input id="l_vehicle" required></label>
 <label>Date<input id="l_date" type="date" required></label>
 <label>Loading Point<input id="l_from" required></label>
 <label>Destination<input id="l_to" required></label>
 <label>Goods / Material<input id="l_goods" required></label>
 <label>Quantity / Weight<input id="l_qty" required></label>
 </div>
 ${err?`<div class="error">${err}</div>`:""}
 <div class="actions"><button class="primary" onclick="addLoading()">Save Loading Slip</button></div></div>
 <div class="card"><h3>Recent Loading Slips</h3><div class="table-wrap"><table><tr><th>Date</th><th>Firm</th><th>Vehicle</th><th>From</th><th>To</th><th>Goods</th><th>Qty</th></tr>${rows||"<tr><td colspan=7>No entries</td></tr>"}</table></div></div>`;
}
async function addLoading(){
 if(!state.firm){lastError="Select a firm first (Firm Setup).";return show("Loading Slip");}
 try{
  await apiPost("/loading-slips",{firm_id:state.firm.id,slip_date:v("l_date"),vehicle_no:v("l_vehicle"),loading_point:v("l_from"),destination:v("l_to"),goods_description:v("l_goods"),quantity_weight:v("l_qty")});
 }catch(e){lastError=e.message;return show("Loading Slip");}
 alert("Loading Slip saved");show("Dashboard");
}
function biltiForm(err){
 let rows=state.bilties.map(x=>`<tr><td>${x.bilti_date}</td><td>${x.bilti_no}</td><td>${firmName(x.firm_id)}</td><td>${x.consignor}</td><td>₹${x.freight}</td></tr>`).join("");
 return `<div class="card"><h2>Bilti / GR</h2><div class="grid">
 <label>Bilti No.<input id="b_no" required></label><label>Date<input id="b_date" type="date" required></label>
 <label>Consignor / Goods Provider<input id="b_party" required></label><label>Consignee<input id="b_consignee" required></label>
 <label>From<input id="b_from" required></label><label>To<input id="b_to" required></label>
 <label>Lorry No.<input id="b_vehicle" required></label><label>Truck Owner<input id="b_owner" required></label>
 <label>Agent / Dalal<input id="b_agent"></label><label>Goods / Description<input id="b_goods" required></label>
 <label>Weight<input id="b_weight" required></label><label>Freight<input id="b_freight" type="number" min="0.01" step="0.01" required></label>
 <label>Dalali (visible on Bilti)<input id="b_dalali" type="number" min="0" step="0.01" value="0"></label>
 <label>Advance to Truck Owner<input id="b_advance" type="number" min="0" step="0.01" value="0"></label>
 <label class="full no-print">FD — Freight Difference (hidden from printed Bilti)<input id="b_fd" type="number" min="0" step="0.01" value="0"></label>
 </div>
 <div class="notice">FD is stored in accounting and Agent/Dalal ledger, but is excluded from the printed Bilti.</div>
 ${err?`<div class="error">${err}</div>`:""}
 <div class="actions"><button class="primary" onclick="addBilti()">Save Bilti</button><button class="secondary" onclick="window.print()">Print</button></div></div>
 <div class="card"><h3>Recent Bilties</h3><div class="table-wrap"><table><tr><th>Date</th><th>Bilti No.</th><th>Firm</th><th>Consignor</th><th>Freight</th></tr>${rows||"<tr><td colspan=5>No entries</td></tr>"}</table></div></div>`;
}
async function addBilti(){
 if(!state.firm){lastError="Select a firm first (Firm Setup).";return show("Bilti / GR");}
 try{
  await apiPost("/bilties",{firm_id:state.firm.id,bilti_no:v("b_no"),bilti_date:v("b_date"),consignor:v("b_party"),consignee:v("b_consignee"),from_location:v("b_from"),to_location:v("b_to"),vehicle_no:v("b_vehicle"),truck_owner_name:v("b_owner"),agent_name:v("b_agent")||null,goods_description:v("b_goods"),weight:v("b_weight"),freight:n("b_freight"),dalali:n("b_dalali"),advance_to_owner:n("b_advance"),freight_difference:n("b_fd")});
 }catch(e){lastError=e.message;return show("Bilti / GR");}
 alert("Bilti saved. Ledger entries generated automatically.");show("Dashboard");
}
function agentLedger(err){
 let rows=state.bilties.filter(x=>x.agent).map(x=>`<tr><td>${x.bilti_date}</td><td>${x.bilti_no}</td><td>${firmName(x.firm_id)}</td><td>${x.agent.name}</td><td>₹${money(x.dalali)}</td><td>₹${money(x.freight_difference)}</td><td>₹${money(Number(x.dalali)+Number(x.freight_difference))}</td></tr>`).join("");
 let payRows=state.agentPayments.map(p=>`<tr><td>${p.payment_date}</td><td>${firmName(p.firm_id)}</td><td>${p.agent.name}</td><td>₹${money(p.amount)}</td><td>${p.mode||""}</td><td>${p.remarks||""}</td></tr>`).join("");
 let balances={};
 state.bilties.filter(x=>x.agent).forEach(x=>{const k=x.agent.id;balances[k]=balances[k]||{name:x.agent.name,accrued:0,paid:0};balances[k].accrued+=Number(x.dalali)+Number(x.freight_difference);});
 state.agentPayments.forEach(p=>{const k=p.agent.id;balances[k]=balances[k]||{name:p.agent.name,accrued:0,paid:0};balances[k].paid+=Number(p.amount);});
 let balRows=Object.values(balances).map(b=>`<tr><td>${b.name}</td><td>₹${money(b.accrued)}</td><td>₹${money(b.paid)}</td><td>₹${money(b.accrued-b.paid)}</td></tr>`).join("");
 return `<div class="card"><h2>Agent / Dalal Ledger</h2><div class="table-wrap"><table><tr><th>Date</th><th>Bilti</th><th>Firm</th><th>Agent</th><th>Dalali</th><th>FD</th><th>Total</th></tr>${rows||"<tr><td colspan=7>No entries</td></tr>"}</table></div></div>
 <div class="card"><h3>Balances</h3><div class="table-wrap"><table><tr><th>Agent</th><th>Accrued</th><th>Paid</th><th>Balance</th></tr>${balRows||"<tr><td colspan=4>No agents</td></tr>"}</table></div></div>
 <div class="card"><h3>Record Agent Payment</h3><div class="grid">
 <label>Agent<select id="ap_agent">${state.agents.map(a=>`<option value="${a.id}">${a.name}</option>`).join("")}</select></label>
 <label>Amount<input id="ap_amount" type="number" min="0.01" step="0.01"></label>
 <label>Date<input id="ap_date" type="date"></label>
 <label>Mode<input id="ap_mode" placeholder="cash / bank / upi"></label>
 <label class="full">Remarks<input id="ap_remarks"></label></div>
 ${err?`<div class="error">${err}</div>`:""}
 <div class="actions"><button class="primary" onclick="addAgentPayment()">Record Payment</button></div></div>
 <div class="card"><h3>Recent Payments</h3><div class="table-wrap"><table><tr><th>Date</th><th>Firm</th><th>Agent</th><th>Amount</th><th>Mode</th><th>Remarks</th></tr>${payRows||"<tr><td colspan=6>No payments</td></tr>"}</table></div></div>`;
}
async function addAgentPayment(){
 if(!state.firm){lastError="Select a firm first (Firm Setup).";return show("Agent Ledger");}
 const agentId=document.getElementById("ap_agent").value;
 if(!agentId){lastError="No agents yet — add a Bilti with an Agent / Dalal first.";return show("Agent Ledger");}
 try{
  await apiPost("/agent-payments",{firm_id:state.firm.id,agent_id:agentId,amount:n("ap_amount"),payment_date:v("ap_date"),mode:v("ap_mode")||null,remarks:v("ap_remarks")||null});
 }catch(e){lastError=e.message;return show("Agent Ledger");}
 show("Agent Ledger");
}
function ownerLedger(err){
 let rows=state.bilties.map(x=>`<tr><td>${x.bilti_date}</td><td>${x.bilti_no}</td><td>${firmName(x.firm_id)}</td><td>${x.truck_owner.name}</td><td>${x.vehicle_no}</td><td>₹${money(x.freight)}</td><td>₹${money(x.advance_to_owner)}</td><td>₹${money(Number(x.freight)-Number(x.advance_to_owner))}</td></tr>`).join("");
 let payRows=state.truckOwnerPayments.map(p=>`<tr><td>${p.payment_date}</td><td>${firmName(p.firm_id)}</td><td>${p.truck_owner.name}</td><td>₹${money(p.amount)}</td><td>${p.mode||""}</td><td>${p.remarks||""}</td></tr>`).join("");
 let balances={};
 state.bilties.forEach(x=>{const k=x.truck_owner.id;balances[k]=balances[k]||{name:x.truck_owner.name,freight:0,advance:0,paid:0};balances[k].freight+=Number(x.freight);balances[k].advance+=Number(x.advance_to_owner);});
 state.truckOwnerPayments.forEach(p=>{const k=p.truck_owner.id;balances[k]=balances[k]||{name:p.truck_owner.name,freight:0,advance:0,paid:0};balances[k].paid+=Number(p.amount);});
 let balRows=Object.values(balances).map(b=>`<tr><td>${b.name}</td><td>₹${money(b.freight)}</td><td>₹${money(b.advance)}</td><td>₹${money(b.paid)}</td><td>₹${money(b.freight-b.advance-b.paid)}</td></tr>`).join("");
 return `<div class="card"><h2>Truck Owner Ledger</h2><div class="table-wrap"><table><tr><th>Date</th><th>Bilti</th><th>Firm</th><th>Owner</th><th>Lorry</th><th>Freight</th><th>Advance</th><th>Balance</th></tr>${rows||"<tr><td colspan=8>No entries</td></tr>"}</table></div></div>
 <div class="card"><h3>Balances</h3><div class="table-wrap"><table><tr><th>Owner</th><th>Freight</th><th>Advance</th><th>Paid</th><th>Balance</th></tr>${balRows||"<tr><td colspan=5>No owners</td></tr>"}</table></div></div>
 <div class="card"><h3>Record Owner Payment</h3><div class="grid">
 <label>Owner<select id="op_owner">${state.truckOwners.map(o=>`<option value="${o.id}">${o.name}</option>`).join("")}</select></label>
 <label>Amount<input id="op_amount" type="number" min="0.01" step="0.01"></label>
 <label>Date<input id="op_date" type="date"></label>
 <label>Mode<input id="op_mode" placeholder="cash / bank / upi"></label>
 <label class="full">Remarks<input id="op_remarks"></label></div>
 ${err?`<div class="error">${err}</div>`:""}
 <div class="actions"><button class="primary" onclick="addOwnerPayment()">Record Payment</button></div></div>
 <div class="card"><h3>Recent Payments</h3><div class="table-wrap"><table><tr><th>Date</th><th>Firm</th><th>Owner</th><th>Amount</th><th>Mode</th><th>Remarks</th></tr>${payRows||"<tr><td colspan=6>No payments</td></tr>"}</table></div></div>`;
}
async function addOwnerPayment(){
 if(!state.firm){lastError="Select a firm first (Firm Setup).";return show("Truck Owner Ledger");}
 const ownerId=document.getElementById("op_owner").value;
 if(!ownerId){lastError="No truck owners yet — add a Bilti first.";return show("Truck Owner Ledger");}
 try{
  await apiPost("/truck-owner-payments",{firm_id:state.firm.id,truck_owner_id:ownerId,amount:n("op_amount"),payment_date:v("op_date"),mode:v("op_mode")||null,remarks:v("op_remarks")||null});
 }catch(e){lastError=e.message;return show("Truck Owner Ledger");}
 show("Truck Owner Ledger");
}
function receiptForm(err){
 let rows=state.receipts.map(r=>{const b=state.bilties.find(x=>x.id===r.bilti_id);return `<tr><td>${r.receipt_date}</td><td>${b?b.bilti_no:r.bilti_id}</td><td>${firmName(r.firm_id)}</td><td>${r.received_from}</td><td>₹${money(r.amount)}</td><td>${r.remarks||""}</td></tr>`}).join("");
 return `<div class="card"><h2>Final Receipt</h2><div class="grid">
 <label>Bilti<select id="r_bilti">${state.bilties.map(b=>`<option value="${b.id}">${b.bilti_no} — ${firmName(b.firm_id)} (₹${money(b.freight)})</option>`).join("")}</select></label>
 <label>Receipt Date<input id="r_date" type="date"></label>
 <label>Received From<input id="r_from"></label>
 <label>Amount<input id="r_amount" type="number" min="0.01" step="0.01"></label>
 <label class="full">Remarks<input id="r_remarks"></label></div>
 ${err?`<div class="error">${err}</div>`:""}
 <div class="actions"><button class="primary" onclick="addReceipt()">Save Receipt</button><button class="secondary" onclick="window.print()">Print</button></div></div>
 <div class="card"><h3>Recent Receipts</h3><div class="table-wrap"><table><tr><th>Date</th><th>Bilti</th><th>Firm</th><th>Received From</th><th>Amount</th><th>Remarks</th></tr>${rows||"<tr><td colspan=6>No entries</td></tr>"}</table></div></div>`;
}
async function addReceipt(){
 if(!state.firm){lastError="Select a firm first (Firm Setup).";return show("Final Receipt");}
 const biltiId=document.getElementById("r_bilti").value;
 if(!biltiId){lastError="No bilties yet — create a Bilti / GR first.";return show("Final Receipt");}
 try{
  await apiPost("/receipts",{firm_id:state.firm.id,bilti_id:biltiId,receipt_date:v("r_date"),received_from:v("r_from"),amount:n("r_amount"),remarks:v("r_remarks")||null});
 }catch(e){lastError=e.message;return show("Final Receipt");}
 alert("Final receipt saved");show("Final Receipt");
}
const REPORTS=[
 {id:"bilti",label:"Bilti-wise",fn:reportBiltiWise},
 {id:"party",label:"Party/Goods Provider",fn:reportParty},
 {id:"agent",label:"Agent/Dalal",fn:reportAgent},
 {id:"fd",label:"Freight Difference",fn:reportFD},
 {id:"owner",label:"Truck Owner",fn:reportOwner},
 {id:"driver",label:"Driver",fn:null},
 {id:"lorry",label:"Lorry/Trip",fn:reportLorry},
 {id:"advance",label:"Advance",fn:reportAdvance},
 {id:"receipt",label:"Final Receipt",fn:reportReceipt},
 {id:"firm",label:"Firm-wise",fn:reportFirmWise},
 {id:"outstanding",label:"Outstanding",fn:reportOutstanding},
 {id:"pl",label:"Profit/Loss",fn:null},
 {id:"daybook",label:"Day Book",fn:reportDayBook},
 {id:"trial",label:"Trial Balance",fn:null},
 {id:"balance",label:"Balance Sheet",fn:null}
];
function reports(){
 if(!state.reportView) state.reportView="firm";
 let pills=REPORTS.map(r=>r.fn
  ?`<button class="${state.reportView===r.id?'primary':'secondary'}" onclick="showReport('${r.id}')">${r.label}</button>`
  :`<button class="secondary" disabled title="Not built yet">${r.label} (soon)</button>`
 ).join("");
 let active=REPORTS.find(r=>r.id===state.reportView);
 let body=(active&&active.fn)?active.fn():reportFirmWise();
 return `<div class="card"><h2>Reports</h2><div class="actions">${pills}</div></div>${body}`;
}
function showReport(id){state.reportView=id;document.getElementById("app").innerHTML=reports();}
function reportTable(title,headCells,rows,colCount){
 return `<div class="card"><h3>${title}</h3><div class="table-wrap"><table><tr>${headCells.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.join("")||`<tr><td colspan=${colCount}>No entries</td></tr>`}</table></div></div>`;
}
function reportFirmWise(){
 let rows=state.firms.map(f=>{
  let b=state.bilties.filter(x=>x.firm_id===f.id);
  let received=state.receipts.filter(r=>r.firm_id===f.id).reduce((s,r)=>s+Number(r.amount),0);
  let freight=b.reduce((s,x)=>s+Number(x.freight),0);
  return `<tr><td>${f.name}</td><td>${b.length}</td><td>₹${money(freight)}</td><td>₹${money(b.reduce((s,x)=>s+Number(x.dalali),0))}</td><td>₹${money(b.reduce((s,x)=>s+Number(x.freight_difference),0))}</td><td>₹${money(b.reduce((s,x)=>s+Number(x.advance_to_owner),0))}</td><td>₹${money(received)}</td><td>₹${money(freight-received)}</td></tr>`;
 });
 return reportTable("Firm-wise Report",["Firm","Bilties","Freight","Dalali","FD","Owner Advances","Received","Outstanding"],rows,8);
}
function reportBiltiWise(){
 let rows=state.bilties.map(x=>`<tr><td>${x.bilti_date}</td><td>${x.bilti_no}</td><td>${firmName(x.firm_id)}</td><td>${x.consignor}</td><td>${x.consignee}</td><td>${x.vehicle_no}</td><td>${x.truck_owner.name}</td><td>${x.agent?x.agent.name:""}</td><td>₹${money(x.freight)}</td><td>₹${money(x.dalali)}</td><td>₹${money(x.advance_to_owner)}</td><td>₹${money(x.freight_difference)}</td></tr>`);
 return reportTable("Bilti-wise Report",["Date","Bilti No","Firm","Consignor","Consignee","Vehicle","Truck Owner","Agent","Freight","Dalali","Advance","FD"],rows,12);
}
function reportParty(){
 let byParty={};
 state.bilties.forEach(x=>{byParty[x.consignor]=byParty[x.consignor]||{count:0,freight:0};byParty[x.consignor].count++;byParty[x.consignor].freight+=Number(x.freight);});
 let rows=Object.entries(byParty).map(([name,v])=>`<tr><td>${name}</td><td>${v.count}</td><td>₹${money(v.freight)}</td></tr>`);
 return reportTable("Party / Goods Provider Report",["Party (Consignor)","Bilties","Total Freight"],rows,3);
}
function reportAgent(){
 let balances={};
 state.bilties.filter(x=>x.agent).forEach(x=>{const k=x.agent.id;balances[k]=balances[k]||{name:x.agent.name,accrued:0,paid:0};balances[k].accrued+=Number(x.dalali)+Number(x.freight_difference);});
 state.agentPayments.forEach(p=>{const k=p.agent.id;balances[k]=balances[k]||{name:p.agent.name,accrued:0,paid:0};balances[k].paid+=Number(p.amount);});
 let rows=Object.values(balances).map(b=>`<tr><td>${b.name}</td><td>₹${money(b.accrued)}</td><td>₹${money(b.paid)}</td><td>₹${money(b.accrued-b.paid)}</td></tr>`);
 return reportTable("Agent / Dalal Report",["Agent","Accrued","Paid","Balance"],rows,4);
}
function reportFD(){
 let withFd=state.bilties.filter(x=>Number(x.freight_difference)>0);
 let total=withFd.reduce((s,x)=>s+Number(x.freight_difference),0);
 let rows=withFd.map(x=>`<tr><td>${x.bilti_date}</td><td>${x.bilti_no}</td><td>${firmName(x.firm_id)}</td><td>${x.agent?x.agent.name:""}</td><td>₹${money(x.freight_difference)}</td></tr>`);
 if(withFd.length) rows.push(`<tr><td colspan=4><b>Total</b></td><td><b>₹${money(total)}</b></td></tr>`);
 return reportTable("Freight Difference Report",["Date","Bilti No","Firm","Agent","FD"],rows,5);
}
function reportOwner(){
 let balances={};
 state.bilties.forEach(x=>{const k=x.truck_owner.id;balances[k]=balances[k]||{name:x.truck_owner.name,freight:0,advance:0,paid:0};balances[k].freight+=Number(x.freight);balances[k].advance+=Number(x.advance_to_owner);});
 state.truckOwnerPayments.forEach(p=>{const k=p.truck_owner.id;balances[k]=balances[k]||{name:p.truck_owner.name,freight:0,advance:0,paid:0};balances[k].paid+=Number(p.amount);});
 let rows=Object.values(balances).map(b=>`<tr><td>${b.name}</td><td>₹${money(b.freight)}</td><td>₹${money(b.advance)}</td><td>₹${money(b.paid)}</td><td>₹${money(b.freight-b.advance-b.paid)}</td></tr>`);
 return reportTable("Truck Owner Report",["Owner","Freight","Advance","Paid","Balance"],rows,5);
}
function reportLorry(){
 let byVehicle={};
 state.bilties.forEach(x=>{byVehicle[x.vehicle_no]=byVehicle[x.vehicle_no]||{trips:0,freight:0};byVehicle[x.vehicle_no].trips++;byVehicle[x.vehicle_no].freight+=Number(x.freight);});
 let rows=Object.entries(byVehicle).map(([vehicle,v])=>`<tr><td>${vehicle}</td><td>${v.trips}</td><td>₹${money(v.freight)}</td></tr>`);
 return reportTable("Lorry / Trip Report",["Vehicle","Trips","Total Freight"],rows,3);
}
function reportAdvance(){
 let withAdvance=state.bilties.filter(x=>Number(x.advance_to_owner)>0);
 let total=withAdvance.reduce((s,x)=>s+Number(x.advance_to_owner),0);
 let rows=withAdvance.map(x=>`<tr><td>${x.bilti_date}</td><td>${x.bilti_no}</td><td>${x.truck_owner.name}</td><td>₹${money(x.advance_to_owner)}</td></tr>`);
 if(withAdvance.length) rows.push(`<tr><td colspan=3><b>Total</b></td><td><b>₹${money(total)}</b></td></tr>`);
 return reportTable("Advance Report",["Date","Bilti No","Owner","Advance"],rows,4);
}
function reportReceipt(){
 let rows=state.receipts.map(r=>`<tr><td>${r.receipt_date}</td><td>${(state.bilties.find(b=>b.id===r.bilti_id)||{}).bilti_no||""}</td><td>${firmName(r.firm_id)}</td><td>${r.received_from}</td><td>₹${money(r.amount)}</td><td>${r.remarks||""}</td></tr>`);
 return reportTable("Final Receipt Report",["Date","Bilti No","Firm","Received From","Amount","Remarks"],rows,6);
}
function reportOutstanding(){
 let rows=state.bilties.map(x=>{
  let received=state.receipts.filter(r=>r.bilti_id===x.id).reduce((s,r)=>s+Number(r.amount),0);
  let outstanding=Number(x.freight)-received;
  return {x,received,outstanding};
 }).filter(r=>r.outstanding!==0).map(({x,received,outstanding})=>`<tr><td>${firmName(x.firm_id)}</td><td>${x.bilti_no}</td><td>${x.consignee}</td><td>₹${money(x.freight)}</td><td>₹${money(received)}</td><td>₹${money(outstanding)}</td></tr>`);
 return reportTable("Outstanding Report",["Firm","Bilti No","Consignee","Freight","Received","Outstanding"],rows,6);
}
function reportDayBook(){
 let events=[];
 state.loading.forEach(x=>events.push({date:x.slip_date,type:"Loading Slip",desc:`${x.vehicle_no}: ${x.loading_point} → ${x.destination}`,amount:null}));
 state.bilties.forEach(x=>events.push({date:x.bilti_date,type:"Bilti",desc:`${x.bilti_no} (${x.consignor} → ${x.consignee})`,amount:x.freight}));
 state.agentPayments.forEach(p=>events.push({date:p.payment_date,type:"Agent Payment",desc:p.agent.name,amount:p.amount}));
 state.truckOwnerPayments.forEach(p=>events.push({date:p.payment_date,type:"Owner Payment",desc:p.truck_owner.name,amount:p.amount}));
 state.receipts.forEach(r=>events.push({date:r.receipt_date,type:"Receipt",desc:r.received_from,amount:r.amount}));
 events.sort((a,b)=>b.date.localeCompare(a.date));
 let rows=events.map(e=>`<tr><td>${e.date}</td><td>${e.type}</td><td>${e.desc}</td><td>${e.amount!=null?"₹"+money(e.amount):""}</td></tr>`);
 return reportTable("Day Book",["Date","Type","Details","Amount"],rows,4);
}
function firmSetup(){
 return `<div class="card"><h2>Firm Setup</h2><div class="grid"><label>Current Firm<select id="firmSelect">${state.firms.map(f=>`<option value="${f.id}" ${state.firm&&f.id===state.firm.id?'selected':''}>${f.name}</option>`).join("")}</select></label></div><div class="actions"><button class="primary" onclick="selectFirm()">Select Firm</button></div><p class="muted">The selected firm automatically prints on Loading Slip, Bilti and Final Receipt and is attached to every ledger entry.</p></div>`;
}
function selectFirm(){
 const id=document.getElementById("firmSelect").value;
 state.firm=state.firms.find(f=>f.id===id)||null;
 updateHeader();show("Dashboard");
}
function updateHeader(){document.getElementById("firmTitle").textContent=state.firm?state.firm.name:"Transport Management System"}
function v(id){return document.getElementById(id).value} function n(id){return Number(v(id)||0)}
function sum(k){return state.bilties.reduce((s,x)=>s+(Number(x[k])||0),0).toFixed(2)}
async function init(){
 nav();
 try{
  state.firms=await apiGet("/firms");
  state.firm=state.firms[0]||null;
  updateHeader();
 }catch(e){
  document.getElementById("app").innerHTML=`<div class="card"><div class="error">Could not reach the API: ${e.message}</div></div>`;
  return;
 }
 show("Dashboard");
}
init();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
